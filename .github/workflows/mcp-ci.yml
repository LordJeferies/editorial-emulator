name: MCP CI

on:
  push:
    paths:
      - 'mcp/**'
      - 'js/defaults.js'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'js/defaults.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: mcp
        run: npm run check
      - name: Verify docs and server
        run: |
          test -f mcp/server.mjs
          test -f mcp/README.md
          test -f mcp/CRITERIA.md
          test -f mcp/EXAMPLES.md
          test -f mcp.html
