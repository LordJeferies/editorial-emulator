name: Validate V4.4

on:
  push:
    branches: [v44-board-fluidity]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/bootstrap-v44.js
          node --check js/planner-v44.js
          node --check js/workflow-ui-v44.js
          node --check js/flexible-week-v33.js
          node --check js/catalog-v37.js
          node --check js/catalog-v38.js
          node --check js/smart-drag-v42.js
          node --check js/workflow-data-v43.js
          node --check js/workflow-create-v43.js
          node --check js/workflow-filters-v43.js
          node --check js/workflow-sync-v43.js
          node --check sw.js
      - name: Check manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
      - name: Check V4.4 wiring
        run: |
          grep -q "bootstrap-v44.js" supabase-config.js
          grep -q "planner-v44.js" js/bootstrap-v44.js
          grep -q "workflow-ui-v44.js" js/bootstrap-v44.js
          grep -q "system-v44.css" sw.js
