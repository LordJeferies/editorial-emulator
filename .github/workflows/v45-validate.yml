name: Validate V4.5

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'supabase-config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'js/bootstrap-v45.js'
      - 'js/ux-v28.js'
      - 'js/flexible-week-v33.js'
      - 'js/catalog-v45.js'
      - 'css/system-v45.css'
      - '.github/workflows/v45-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check supabase-config.js
          node --check sw.js
          node --check js/bootstrap-v45.js
          node --check js/ux-v28.js
          node --check js/planner-v44.js
          node --check js/flexible-week-v33.js
          node --check js/catalog-v45.js
          node --check js/smart-drag-v42.js
          node --check js/workflow-data-v43.js
          node --check js/workflow-ui-v44.js
          node --check js/workflow-create-v43.js
          node --check js/workflow-filters-v43.js
          node --check js/workflow-sync-v43.js
      - name: Check manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
      - name: Check canonical boot wiring
        run: |
          grep -q 'supabase-config.js?v=45' index.html
          test "$(grep -c '<script' index.html)" -eq 1
          grep -q 'bootstrap-v45.js?v=45' supabase-config.js
          grep -q 'catalog-v45.js?v=45' js/bootstrap-v45.js
          grep -q 'system-v45.css' sw.js
